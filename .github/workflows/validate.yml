name: ZUNE Admin source validation
on:
  push:
    branches: [main, integration/order-lifecycle]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './android-app/*' -print0 | xargs -0 -n1 node --check
