<!doctype html>
<html lang="sw">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087a55">
  <meta name="description" content="ZUNE Premium Admin — ukurasa wa kuanzisha mfumo">
  <title>ZUNE PREMIUM ADMIN 3.0</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}
    body{background:#f4f7f6;font:14px system-ui,sans-serif}
    #zune-page{display:block;width:100%;height:100%;border:0;background:#fff}
    #zune-loader{position:fixed;inset:0;display:grid;place-items:center;background:#f4f7f6;color:#087a55;z-index:2}
    #zune-loader[hidden]{display:none}.loader-card{text-align:center;padding:24px}
    .spinner{width:30px;height:30px;border:3px solid #d7e8e1;border-top-color:#087a55;border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <!-- index.html ni bootstrap pekee. UI na modules zinatoka pages/*.html -->
  <div id="zune-loader"><div class="loader-card"><div class="spinner"></div><strong>ZUNE PREMIUM ADMIN</strong><p>Inapakia module…</p></div></div>
  <iframe id="zune-page" title="ZUNE Premium Admin module" src="pages/dashboard.html"></iframe>
  <script>
    (() => {
      'use strict';
      const frame = document.getElementById('zune-page');
      const loader = document.getElementById('zune-loader');
      const allowed = new Set([
        'dashboard','users','sellers','seller-applications','verification','products',
        'categories','orders','payments','wallets','withdrawals','commissions','delivery',
        'disputes','support','promotions','announcements','notifications','reports',
        'settings','security','audit','admin-account','ai','health','database','backup','login'
      ]);
      function pageFromHash() {
        const raw = location.hash.replace(/^#/, '').split(/[/?]/)[0];
        return allowed.has(raw) ? raw : 'dashboard';
      }
      function loadPage() {
        const target = 'pages/' + pageFromHash() + '.html';
        if (!frame.src.endsWith('/' + target) && !frame.src.endsWith(target)) frame.src = target;
      }
      frame.addEventListener('load', () => { loader.hidden = true; });
      frame.addEventListener('error', () => {
        loader.hidden = false;
        loader.querySelector('p').textContent = 'Imeshindikana kupakia pages module. Hakikisha folder la pages lipo.';
      });
      window.addEventListener('message', event => {
        if (event.source !== frame.contentWindow || !event.data || event.data.type !== 'zune:module-route') return;
        const page = String(event.data.page || '');
        if (!allowed.has(page)) return;
        if (location.hash !== '#' + page) history.replaceState(null, '', '#' + page);
        loadPage();
      });
      window.addEventListener('hashchange', loadPage);
      loadPage();
    })();
  </script>
</body>
</html>
